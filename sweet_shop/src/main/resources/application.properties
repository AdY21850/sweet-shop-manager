# ===============================
# APPLICATION
# ===============================
spring.application.name=sweet_shop

# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIG (POSTGRESQL - RENDER)
# ===============================
spring.datasource.url=${DB_URL:${DATABASE_URL}}
spring.datasource.username=${DB_USER:${DATABASE_USERNAME}}
spring.datasource.password=${DB_PASS:${DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# LOGGING (DB DEBUG)
# ===============================
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=INFO

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:default_dev_secret}
jwt.expiration=86400000

# ===============================
# GOOGLE AUTH CONFIG
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:dummy}

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# ENCODING
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================
# PROD OPTIMIZATION
# ===============================
spring.sql.init.mode=never
spring.main.lazy-initialization=true
